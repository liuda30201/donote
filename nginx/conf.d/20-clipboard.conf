# =============================================================================
# web-clipboard 反向代理
#  - 仅 HTTPS (443)
#  - 所有内容（含 /uploads/、原图、文件、Socket.IO）都必须通过认证
#  - 认证方式：浏览器 Cookie wc_auth = base64(访问密码)，由 app 的 /auth-verify 校验
#  - 分享功能整体禁用
#  - 上传内容强制下载，禁止被当作 HTML/SVG 执行
# =============================================================================

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name node.7705.work;

    # ---- 证书（由 deploy-certs.sh / certbot 写入证书目录）----
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/nginx/certs/fullchain.pem;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    # 前端是单页应用，脚本/样式均为同源静态文件，无内联脚本与外部依赖。
    # 这里收紧到同源，配合应用侧对下载响应的 default-src 'none'; sandbox 形成纵深防御。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'" always;

    access_log /var/log/nginx/access.log wcb;

    # 上传上限：应用层 multer 硬限制 100 MiB，这里留出 multipart 开销
    client_max_body_size 101m;
    client_body_timeout 300s;
    client_body_buffer_size 1m;

    # ---- 认证校验子请求：200=已登录，401=未登录 ----
    location = /__auth {
        internal;
        proxy_pass http://app:3000/api/messages/auth-verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Access-Password $wcb_auth_pass;
        proxy_set_header Cookie $http_cookie;
    }

    # ---- 健康检查（不需要认证，仅返回 ok）----
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---- ACME HTTP-01 目录 ----
    # 80 端口那个 server 块已处理挑战，但 80 与 443 的 server_name 相同，
    # 若不加这一块，http 请求一旦被跳转到 https 且 certbot 用了 https 路径就会 404。
    # `^~` 保证它优先于下面的 `location /`。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # ---- Socket.IO 客户端脚本（公开）----
    # 这是静态 JS，不含任何数据，但登录页在未登录时也要加载它：
    # index.html 里 <script src="/socket.io/socket.io.js"> 是普通同步脚本，
    # 若它返回 401，浏览器会把它当成脚本执行失败并抛未捕获错误。
    # 因此这里必须精确放行，且优先级要高于下面的 location /socket.io/。
    location = /socket.io/socket.io.js {
        proxy_pass http://app:3000/socket.io/socket.io.js;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie            $http_cookie;
    }

    # ---- 登录状态查询（公开）----
    # 登录页在未登录时必须能读到它，否则 requirePassword 保持默认值、无法进入登录流程。
    # 注意：单用户模式（本部署）只返回 {mode:"single", requirePassword:true}，无敏感信息；
    #       若将来启用多用户模式（ACCESS_PASSWORDS），该接口会额外返回用户 ID 列表，
    #       届时需要改回受保护（或让应用侧裁剪掉 users 字段）。
    location = /api/auth/status {
        proxy_pass http://app:3000/api/auth/status;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie            $http_cookie;
        add_header Cache-Control "no-store" always;
    }

    # ---- 登录接口 ----
    # 正确密码 -> 下发 HttpOnly 会话 Cookie；错误 -> 透传 401
    location = /api/auth {
        if ($request_method != POST) { return 405; }
        proxy_pass http://app:3000/api/auth;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie            $http_cookie;

        # Cookie 由登录页 JS 写入（见 00-shared.conf 说明）
        add_header Cache-Control "no-store" always;
    }

    # ---- 认证校验（前端登录后确认状态）----
    location = /__authcheck {
        auth_request /__auth;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        add_header Cache-Control "no-store" always;
        add_header X-Auth-User $auth_user always;
        return 204;
    }

    # ---- 登出：清除 Cookie ----
    location = /__logout {
        add_header Set-Cookie "wc_auth=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Lax" always;
        add_header Cache-Control "no-store" always;
        return 204;
    }

    # ---- 分享功能：整体禁用 ----
    location ^~ /api/share/ { return 404; }
    location = /api/share  { return 404; }
    location ^~ /share/    { return 404; }
    location = /share.html { return 404; }
    location = /share.js   { return 404; }

    # ---- 上传目录：绝不直接暴露（应用侧也已改为 404）----
    # 裸 /uploads（无尾斜杠）也会落到 location / 被 Express 301 到 /uploads/，
    # 这里显式封掉，语义上不存在任何暴露路径。
    location = /uploads  { return 404; }
    location ^~ /uploads/ { return 404; }

    # ---- 原图 / 文件流式接口：必须登录 ----
    location ~ ^/api/messages/[^/]+/(image-file|file-stream)$ {
        auth_request /__auth;
        error_page 401 = @unauthorized;

        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Access-Password $wcb_auth_pass;
        proxy_set_header Cookie            $http_cookie;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ---- Socket.IO 实时同步：必须登录 ----
    location /socket.io/ {
        auth_request /__auth;
        error_page 401 = @unauthorized;

        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Access-Password $wcb_auth_pass;
        proxy_set_header Cookie            $http_cookie;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- 其余 API：必须登录 ----
    location /api/ {
        auth_request /__auth;
        error_page 401 = @unauthorized;

        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Access-Password $wcb_auth_pass;
        proxy_set_header Cookie            $http_cookie;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location @unauthorized {
        add_header Cache-Control "no-store" always;
        return 401;
    }

    # ---- 前端静态资源（不需要认证，仅登录页与脚本；数据接口全部受保护）----
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie            $http_cookie;
        proxy_read_timeout 120s;
    }
}
