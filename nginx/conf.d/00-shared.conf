# 共享配置（http 上下文）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 允许通过 Cookie 携带的凭据：值为 base64(密码)，由 app 的 /auth-verify 校验
map $cookie_wc_auth $wcb_auth_pass {
    default  $cookie_wc_auth;
}

log_format wcb '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
               'rt=$request_time ua="$http_user_agent"';

# 登录成功后由前端 JS 写入认证 Cookie。
# nginx 的 add_header 中 $cookie_* 变量在同一请求内尚不可见（Set-Cookie 阶段 map 惰性求值），
# 因此改由登录页 JS 写入；Cookie 值 = base64(访问密码)，仅服务端可校验。
