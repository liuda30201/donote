# 默认站点（80 端口）：仅用于 ACME HTTP-01 验证与 https 跳转
# 明文通道上不承载任何应用数据 —— 除 ACME 挑战路径外一律 301 到 https。
server {
    listen 80;
    listen [::]:80;
    server_name _;

    access_log /var/log/nginx/access.log wcb;

    # ACME HTTP-01：Let's Encrypt 从这里取验证文件（必须明文可达，不能跳转）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # 其余一切（含健康检查）跳转到 https
    location / {
        return 301 https://$host$request_uri;
    }
}

# 默认站点（443）：SNI 不匹配时兜底，禁止任何应用访问。
# 自签证书：换公共 CA 证书后本块不再生效，但保留以便证书异常时仍有 TLS 兜底。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    access_log /var/log/nginx/access.log wcb;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
