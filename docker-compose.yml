# web-clipboard —— 私有跨设备剪贴板
# 架构: 浏览器 --https://<your-domain>--> nginx(TLS) --http--> app(仅内部网络)
# 应用端口不对外暴露；nginx 绑定宿主机 443 (HTTPS 入口) 与 80 (仅 ACME 验证 + 跳转)
# 80 端口上除 /.well-known/acme-challenge/ 外一律 301 到 https，明文不承载任何数据。
services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: web-clipboard-local:1.6.9-p8   # 首页重设计：新 landing CSS、WebP 图片、间距优化
    # 回滚：把上面一行改回 web-clipboard-local:1.6.9-p6，然后 docker compose up -d --no-build app
    container_name: wcb-app
    restart: unless-stopped
    # App drain budget is 25s; Docker must allow it to finish before SIGKILL.
    stop_grace_period: 35s
    environment:
      - PORT=3000
      - ACCESS_PASSWORD=${ACCESS_PASSWORD:?ACCESS_PASSWORD is required}
      - EXPIRE_HOURS=${EXPIRE_HOURS:-720}
      - FILE_CLEANUP_INTERVAL_MINUTES=${FILE_CLEANUP_INTERVAL_MINUTES:-30}
      - MESSAGE_PAGE_SIZE=${MESSAGE_PAGE_SIZE:-30}
      - SOCKET_SYNC_LIMIT=${SOCKET_SYNC_LIMIT:-20}
      - STORAGE_ROOT=/app/data
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/app/data
    expose:
      - "3000"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get({host:'127.0.0.1',port:3000,path:'/api/version'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  nginx:
    image: nginx:1.27-alpine
    container_name: wcb-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "[::]:443:443"
      - "0.0.0.0:443:443"
      - "[::]:80:80"
      - "0.0.0.0:80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/security-headers.inc:/etc/nginx/security-headers.inc:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/www/acme:/var/www/acme:ro   # 必须与 deploy-certs.sh 的 WEBROOT_DIR 一致
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "--no-check-certificate", "--header=Host: ${NGINX_SERVER_NAME:-localhost}", "https://127.0.0.1:443/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  internal:
    driver: bridge
