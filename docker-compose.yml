# web-clipboard —— 私有跨设备剪贴板
# 架构: 浏览器 --https://xm.7705.work:8443--> nginx(TLS) --http--> app(仅内部网络)
# 应用端口不对外暴露；只有 nginx 绑定宿主机的 8443 (IPv6 + IPv4)
services:
  app:
    build:
      context: ./build
      dockerfile: Dockerfile
    image: web-clipboard-local:1.6.9-p2   # 本地构建（aiChenK/web-clipboard v1.6.8 + 本地安全补丁 p2：卡片式布局/搜索/文件预览）
    # 回滚：把上面一行改回 web-clipboard-local:1.6.8-p1，然后 docker compose up -d app
    container_name: wcb-app
    restart: unless-stopped
    environment:
      - PORT=3000
      - ACCESS_PASSWORD=${ACCESS_PASSWORD:?ACCESS_PASSWORD is required}
      - EXPIRE_HOURS=${EXPIRE_HOURS:-720}
      - FILE_CLEANUP_INTERVAL_MINUTES=${FILE_CLEANUP_INTERVAL_MINUTES:-30}
      - MESSAGE_PAGE_SIZE=${MESSAGE_PAGE_SIZE:-30}
      - SOCKET_SYNC_LIMIT=${SOCKET_SYNC_LIMIT:-20}
      - STORAGE_ROOT=/app/data
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/app/data
    expose:
      - "3000"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get({host:'127.0.0.1',port:3000,path:'/api/version'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  nginx:
    image: docker.1panel.live/library/nginx:1.27-alpine
    container_name: wcb-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "[::]:8443:8443"
      - "0.0.0.0:8443:8443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/www:/var/www/acme:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "--no-check-certificate", "--header=Host: xm.7705.work", "https://127.0.0.1:8443/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  internal:
    driver: bridge
